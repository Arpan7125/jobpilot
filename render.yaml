# Render Blueprint: Go API, Next.js web app and Postgres, in the same shape as
# the live deployment (Singapore, free plan).
# Secrets are generated by Render or set in its dashboard, never committed.
services:
  - type: web
    name: jobpilot-api
    runtime: go
    rootDir: apps/api
    plan: free
    region: singapore
    buildCommand: go build -o bin/server ./cmd/server
    startCommand: ./bin/server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobpilot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # the web app's URL, set after the first deploy
      - key: ANTHROPIC_API_KEY
        sync: false # optional; without it the AI endpoints return 503

  - type: web
    name: jobpilot-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build -w apps/web
    startCommand: npm run start -w apps/web
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_URL
        sync: false # the API's public URL, e.g. https://jobpilot-api.onrender.com

databases:
  - name: jobpilot-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
